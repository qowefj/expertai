<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Challenge Workshop - Experten-Eingabe</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="headerButtons">
          <button id="btnLang" class="btn btnOutline btnSmall" type="button">
            EN
          </button>
          <button id="btnTheme" class="btn btnOutline btnSmall" type="button">
            Day mode
          </button>
        </div>
        <img src="/concircle-blue.png" alt="concircle" class="headerLogo" />
        <h1>AI Challenge Workshop</h1>
        <p id="subtitle" class="subtitle"></p>
        <p id="submissionCount" class="submissionCount muted"></p>
      </header>

      <!-- Form Section -->
      <section id="formSection" class="page">
        <section class="card">
          <div class="cardHeader">
            <div>
              <h2 id="formTitle"></h2>
              <p id="formDesc" class="muted"></p>
            </div>
          </div>

          <!-- Name Input -->
          <div class="nameInputSection">
            <label for="nameInput" id="nameLabel" class="qTitle"></label>
            <input 
              type="text" 
              id="nameInput" 
              class="nameInput" 
              placeholder=""
              autocomplete="name"
            />
            <div id="nameError" class="qHelper error" hidden></div>
          </div>

          <div id="questionsRoot" class="questions"></div>
          <div id="errorBox" class="errorBox" hidden></div>

          <div class="pageActions">
            <button id="btnSubmit" class="btn btnPrimary btnLarge" disabled>
              <span class="btnText" id="btnSubmitText"></span>
              <span class="spinner" hidden></span>
            </button>
            <button id="btnReset" class="btn btnOutline" id="btnResetText"></button>
          </div>
        </section>
      </section>

      <!-- Success Section (shown after submission) -->
      <section id="successSection" class="page" hidden>
        <section class="card successCard">
          <div class="successIcon">&#10003;</div>
          <h2 id="successTitle"></h2>
          <p id="successMessage" class="successMessage"></p>
          <p id="successDetails" class="muted"></p>
        </section>
      </section>

    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
